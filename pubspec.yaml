name: lifeclient
description: A new Flutter project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 8.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.2
  easy_localization: ^3.0.1
  equatable: ^2.0.5

  #Core
  get_it: ^9.2.0

  #state management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  responsive_builder: ^0.7.0
  responsive_framework: ^1.1.0
  syncfusion_flutter_pdfviewer: ^33.2.13
  webview_flutter: ^4.0.2

  #third-party
  app_settings: ^8.0.3
  permission_handler: ^13.0.0
  flutter_inappwebview: ^6.2.0-beta.2

  #core
  cached_network_image: ^3.2.3
  go_router: ^17.0.1

  #util

  flutter_image_compress: ^2.0.4
  lottie: ^3.1.2
  flutter_svg: ^2.0.9

  #firebase
  firebase_core: ^4.13.0
  firebase_storage: ^13.4.6
  firebase_remote_config: ^6.5.6
  firebase_analytics: ^12.4.6
  firebase_messaging: ^16.5.0
  cloud_firestore: ^6.8.0
  firebase_crashlytics: ^5.2.7
  firebase_ui_firestore: ^2.1.0
  cloud_functions: ^6.3.6
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.6

  #database
  shared_preferences: ^2.2.1
  hive_ce: ^2.11.3
  # isar_flutter_libs: ^4.0.0-dev.13
  #package
  image_picker: ^1.0.4
  image_cropper: ^11.0.0
  share_plus: ^12.0.2
  screenshot: ^3.0.0
  path_provider: ^2.1.1
  add_2_calendar: ^3.1.1
  in_app_review:
    git:
      url: https://github.com/robport/in_app_review
      ref: patch-2
      path: in_app_review

  flutter_rating_bar: ^4.0.1
  url_launcher: ^6.2.3
  whatsapp_unilink: ^2.1.0
  kartal: ^4.2.0
  collection: ^1.18.0

  # ui
  dotted_border: ^3.1.0
  shimmer: ^3.0.0
  sliver_snap: ^2.0.0
  font_awesome_flutter: ^11.0.0

  carousel_slider: ^5.0.0
  flutter_speed_dial: ^7.0.0

  #Flutter
  video_player: ^2.7.2

  #Location
  google_maps_flutter: ^2.18.0
  # Selects the SDK-9 iOS implementation instead of the endorsed
  # google_maps_flutter_ios, which cannot support Swift Package Manager because
  # SPM cannot pick the Maps SDK by deployment target. Requires iOS 15+, which
  # matches our target. See google_maps_flutter_ios README.
  google_maps_flutter_ios_sdk9: ^2.18.6
  intl: ^0.20.2

  # JSON
  json_annotation: ^4.8.0

  # TEMPORARY: local path while life_shared 7.0.0 is prepared.
  # Restored to `git: ref: v7.0.0` before this branch merges.
  life_shared:
    path: ../life_shared

  file_picker: ^11.0.3
  sliver_tools: ^0.2.12
  hugeicons: ^1.1.5
  material_symbols_icons: ^4.2951.0
  qr_flutter: ^4.1.0
  shimmer_animation: ^2.2.2+1
  bounceable: ^1.0.0
  grouped_list: ^6.0.0
  like_button: ^2.1.0
  mobile_scanner: ^7.4.0

dependency_overrides:
  # kartal 4.2.0 caps device_info_plus at ^11.3.1 while syncfusion needs
  # ^12.1.0. Pre-existing; drop once kartal relaxes its constraint.
  device_info_plus: ^12.3.0
  # kartal 4.2.0 caps share_plus at ^11.0.0 but only calls the deprecated
  # Share.share(), which still exists in 12.x.
  # 12.0.2 is the ceiling, not 13.3.0: share_plus >=13 needs win32 ^6 while
  # file_picker (all stable releases) still needs win32 ^5.
  share_plus: ^12.0.2

dev_dependencies:
  build_runner: ^2.10.5
  hive_ce_generator: ^1.10.0
  flutter_gen_runner: ^5.2.0
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter

  logger: ^2.0.1
  json_serializable: ^6.6.1
  very_good_analysis: ^10.0.0

  riverpod_generator: ^4.0.0+1
  go_router_builder: ^4.1.3

flutter_gen:
  output: lib/product/generated/
  integrations:
    lottie: true
    flutter_svg: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true

scripts:
  lang: flutter pub run easy_localization:generate  -O lib/product/init/language -f keys -o locale_keys.g.dart --source-dir assets/translations
  dartBuild: dart run build_runner build --delete-conflicting-outputs
  build: flutter pub run build_runner build --delete-conflicting-outputs
  watch: dart run build_runner watch --delete-conflicting-outputs
  buildForce: dart run build_runner build --delete-conflicting-outputs
  pubGet: sh ./scripts/pub_get.sh
  watchBuild: dart run build_runner watch --delete-conflicting-outputs
  general: rps build && rps lang
  podUpdate: cd ios && pod update && cd ..
  fios: flutter clean && flutter pub get && cd ios && pod install && cd ..
  emulator: firebase emulators:start --import=./emulator-data --export-on-exit=./emulator-data
  emulatorImport: node scripts/import_example_data.js
  mt: sh maestro/run_tests.sh
  updateIcon: sh ./scripts/update_icon.sh
flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/
    - assets/docs/
    - assets/lottie/
    - assets/images/
    - assets/svg/
    - assets/avatars/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - { asset: assets/fonts/PlusJakartaSans-Medium.ttf, weight: 500 }
        - { asset: assets/fonts/PlusJakartaSans-SemiBold.ttf, weight: 600 }
        - { asset: assets/fonts/PlusJakartaSans-Bold.ttf, weight: 700 }
        - { asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf, weight: 800 }
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
        - { asset: assets/fonts/DMSerifDisplay-Italic.ttf, style: italic }
