# Her smoke testinin sıfırdan başlangıç noktası.
# clearState ile uygulama verisi silinir; bu yüzden onboarding ve "Yenilikler"
# sheet'i her koşuda görünür. Akış: splash -> onboarding -> whats new -> Anasayfa.
appId: com.hatayiyasat.app
---
- launchApp:
    clearState: true

# Splash GEÇİCİ bir ekrandır; "göründü mü" diye beklemek yarış koşulu üretir
# (Maestro ilk yoklamayı yapmadan kaybolabiliyor). Bunun yerine doğrudan
# splash SONRASI gelen kalıcı duruma beklenir: clearState olduğu için onboarding kesin gelir.
- extendedWaitUntil:
    visible:
      id: "onboardButton"
    timeout: 90000
- tapOn:
    id: "onboardButton"
- waitForAnimationToEnd

# Post-frame açılan "Yenilikler" sheet'i. Başlık sürüm numarası içerdiği için daima
# id ile yakalanır; kapatma butonu yoktur, scrim'e dokunularak kapatılır.
- extendedWaitUntil:
    visible:
      id: "whatsNewSheet"
    timeout: 30000
- tapOn:
    point: "50%,20%"
- waitForAnimationToEnd
- assertNotVisible:
    id: "whatsNewSheet"

- extendedWaitUntil:
    visible:
      id: "mainTabView"
    timeout: 30000

- assertVisible:
    id: "mainTabBottomNavigation"

# Anasayfa Firestore sorgusu döndü mü.
- extendedWaitUntil:
    visible: "Mekanlar"
    timeout: 30000
