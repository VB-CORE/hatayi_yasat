include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Generated files are deliberately NOT excluded: they are no longer committed,
  # so `flutter analyze` is the only gate that catches generated output going
  # stale against its generator. Lint noise from them stays non-fatal via
  # --no-fatal-infos --no-fatal-warnings in CI.
  exclude:
    - lib/product/init/generation/
    - "build/**"
    - "test/.test_coverage.dart"
    - "bin/cache/**"
    - "lib/generated_plugin_registrant.dart"
    - test
    - assets/translations/

linter:
  rules:
    avoid_print: true # Uncomment to disable the avoid_print rule
    prefer_single_quotes: true # Uncomment to enable the prefer_single_quotes rule
    always_declare_return_types: true
    avoid_empty_else: true
    depend_on_referenced_packages: false
    public_member_api_docs: false
    sort_constructors_first: true
    prefer_const_constructors: true
    lines_longer_than_80_chars: false
    sort_pub_dependencies: false
    use_setters_to_change_properties: false
    avoid_positional_boolean_parameters: false
